<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Locksmith</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css?v=1793239910">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('lk-theme') || 'dark'; } catch (e) {}</script>
<style id="web-mode">#btn-market,#btn-update,[data-view=update],#taskpill{display:none!important}</style>
<meta name="description" content="Locksmith NFL: projections, picks, props, fantasy and full play-by-play game simulations.">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="9" r="4.2" fill="currentColor"/><path d="M10 12h4l1.3 8h-6.6z" fill="currentColor"/></svg></span>
      <span><b>Locksmith</b><small id="brandsub">NFL prediction engine</small></span></div>
    <div class="sport" role="group" aria-label="Sport"><button data-sport="all">All</button><button data-sport="nfl">NFL</button><button data-sport="cfb">CFB</button><button data-sport="nhl">Hockey</button><button data-sport="nba">Basketball</button><button data-sport="wnba">WNBA</button><button data-sport="ufc">UFC</button></div>
    <nav id="nav" aria-label="Sections">
      <button data-view="slate"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Picks</button>
      <button data-view="game"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5" transform="rotate(-35 12 12)"/><path d="M9 15l6-6M10.5 10.5l1 1M12.5 12.5l1 1"/></svg>Games</button>
      <button data-view="live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>Live<i class="livedot"></i></button>
      <button data-view="watch"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>Watch</button>
      <button data-view="props"><svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="18" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg>Player props</button>
      <button data-view="fantasy"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.2 1 5.8L12 16.5 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>Fantasy</button>
      <button data-view="record"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>Track record</button>
      <div class="navsep">More</div>
      <button class="minor" data-view="players"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>Player stats</button>
      <button class="minor" data-view="market"><svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-6M22 18H2"/></svg>Market</button>
      <button class="minor" data-view="model"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Model accuracy</button>
      <button class="minor" data-view="research"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>Research</button>
      <button class="minor" data-view="update"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Update</button>
    </nav>
    <div class="side-foot">
      <div id="gen" class="muted">Loading…</div>
      <div id="taskpill" class="pill idle">Idle</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="top-title">
        <div class="eyebrow" id="eyebrow">NFL</div>
        <div class="sport topsport" role="group" aria-label="Sport"><button data-sport="all">All</button><button data-sport="nfl">NFL</button><button data-sport="cfb">CFB</button><button data-sport="nhl">Hockey</button><button data-sport="nba">Basketball</button><button data-sport="wnba">WNBA</button><button data-sport="ufc">UFC</button></div>
        <h1 id="title">Picks</h1>
      </div>
      <div class="top-actions">
        <div class="chips" id="weeks" role="group" aria-label="Week"></div>
        <button class="btn icon" id="theme" title="Switch between dark and light mode" aria-label="Toggle dark mode"></button>
        <button class="btn" id="btn-market" title="Pull live splits and lines from 7 sportsbooks">Market snapshot</button>
        <button class="btn primary" id="btn-update" title="Download the latest data and rebuild everything">Update all</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<nav id="mnav" class="mnav" aria-label="Sections"></nav>
<div id="msheet" class="msheet" hidden><div class="mscrim" data-close></div><div class="mpanel" role="dialog" aria-label="More sections"><div class="mgrab"></div><div id="mlist"></div><div class="mfoot"><button class="btn" id="mtheme"></button><span class="muted" id="mgen"></span></div></div></div>
<script src="ui.js?v=1793239910"></script>
<script src="props.js?v=1793239910"></script>
<script src="live.js?v=1793239910"></script>
<script src="app.js?v=1793239910"></script>
<script src="watch.js?v=1793239910"></script>
<script src="nhl.js?v=1793239910"></script>
<script src="hockey_watch.js?v=1793239910"></script>
<script src="nba.js?v=1793239910"></script>
<script src="ufc.js?v=1793239910"></script>
<script src="cfb.js?v=1793239910"></script>
<script src="today.js?v=1793239910"></script>
<script src="basketball_watch.js?v=1793239910"></script>
</body>
</html>
